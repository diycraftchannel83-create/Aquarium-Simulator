name: Generate GLB-matched fish GIFs

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_fish_gifs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate animated fish assets
        run: python tools/generate_fish_gifs.py
      - name: Commit generated GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/aquarium/fish/*.gif
          if git diff --cached --quiet; then
            echo "GIF assets are already up to date"
            exit 0
          fi
          git commit -m "Generate animated fish GIFs from GLB species catalog"
          git push
